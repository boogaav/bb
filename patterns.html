body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px}

form{display:flex;gap:8px}

input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:600 .9rem/1 inherit;font-family:inherit;padding:10px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.e{color:var(--err);font-size:.82rem;min-height:1.2em;margin-top:10px}

<script>
(function(){
  const P=JSON.parse(document.getElementById("payload").textContent);
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const $=id=>document.getElementById(id);
  async function open(pass){
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
    const html=new TextDecoder().decode(pt);
    try{sessionStorage.setItem("bbk",pass);}catch(e){}
    document.open();document.write(html);document.close();
  }
  async function attempt(pass,silent){
    $("b").disabled=true;$("e").textContent="";
    try{await open(pass);}catch(err){$("b").disabled=false;if(!silent){$("e").textContent="That's not it — try again.";$("p").select();}}
  }
  $("f").addEventListener("submit",e=>{e.preventDefault();attempt($("p").value.trim(),false);});
  try{const s=sessionStorage.getItem("bbk");if(s)attempt(s,true);}catch(e){}
})();
</script>
