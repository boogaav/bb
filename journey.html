  async function open(pass){
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,b64(P.ct));
    const html=new TextDecoder().decode(pt);
    try{sessionStorage.setItem("bbk",pass);}catch(e){}
    document.open();document.write(html);document.close();
  }
  async function attempt(pass,silent){
    $("b").disabled=true;$("e").textContent="";
    try{await open(pass);}catch(err){$("b").disabled=false;if(!silent){$("e").textContent="That's not it — try again.";$("p").select();}}
  }
  $("f").addEventListener("submit",e=>{e.preventDefault();attempt($("p").value.trim(),false);});
  try{const s=sessionStorage.getItem("bbk");if(s)attempt(s,true);}catch(e){}
})();
</script>
